<!DOCTYPE html>
<head>
    <title>Outdoor Rental</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: white;
        }

        .layout {
            width: 520px;
            margin: 40px 25px;
            border-collapse: collapse;
        }

        .layout td {
            border: 1px solid rgb(48, 30, 30);
        }

        header {
            background-color: #fab86c;
            height: 58px;
            text-align: center;
            vertical-align: middle;
        }

        nav {
            background-color: #d9e7fa;
            height: 38px;
            text-align: center;
            vertical-align: middle;
        }

        main {
            background-color: #dd5656;
            height: 220px;
            padding: 20px 40px;
            vertical-align: top;
        }

        aside {
            background-color: #7aee65;
            width: 120px;
            padding: 15px;
            vertical-align: middle;
        }

        footer {
            background-color: #ceb08d;
            height: 38px;
            text-align: center;
            vertical-align: middle;
        }

        h1 {
            font-size: 25px;
            margin-top: 25px;
        }

        p {
            font-size: 12px;
            line-height: 1.4;
        }

        ul {
            font-size: 12px;
            padding-left: 25px;
        }
    </style>
</head>

<body>

    <table class="layout">
        <tr>
            <td colspan="2">
                <header>
                    HEADER
                </header>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <nav>
                    NAVIGASI
                </nav>
            </td>
        </tr>

        <tr>
            <td>
                <main>
                    <h1>Rental Outdoor</h1>

                    <p>
                        Sewa berbagai perlengkapan outdoor berkualitas
                        untuk kebutuhan camping, hiking, dan kegiatan
                        petualangan Anda.
                    </p>

                    <p>
                        Pilih perlengkapan yang sesuai dan nikmati
                        pengalaman outdoor yang lebih nyaman.
                    </p>
                </main>
            </td>

            <td>
                <aside>
                    <strong>Menu:</strong>

                    <ul>
                        <li>Home</li>
                        <li>Produk</li>
                        <li>Layanan</li>
                        <li>Kontak</li>
                    </ul>
                </aside>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <footer>
                    FOOTER
                </footer>
            </td>
        </tr>
    </table>

</body>
</html>
